name: Diagnostyka kursów (tymczasowe)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi
      - run: python tools/market_probe.py > probe.json || true
      - run: |
          git config user.name kay477; git config user.email kay477@users.noreply.github.com
          git checkout --orphan probe && git rm -rfq --cached . && git add probe.json && git commit -qm probe && git push -f origin probe
